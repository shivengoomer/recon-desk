name: Backend CD

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
  # Can also be triggered manually for a forced redeploy
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: backend-cd
  cancel-in-progress: false   # finish the in-flight deploy, don't cancel it

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      DEMO_EXECUTIVE_PASSWORD: ${{ secrets.DEMO_EXECUTIVE_PASSWORD }}
      DEMO_COFOUNDER_PASSWORD: ${{ secrets.DEMO_COFOUNDER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      # Guard: fail fast if DATABASE_URL secret is missing or empty
      - name: Check DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL is empty. Add NEON_PROD_DATABASE_URL to GitHub repo secrets."
            exit 1
          fi
          echo "✅ DATABASE_URL is set ($(echo $DATABASE_URL | cut -d'@' -f2 | cut -d'/' -f1))"

      # Run migrations against the PRODUCTION Neon database before the new code goes live
      - name: Run Alembic migrations (prod)
        run: alembic upgrade head

      # ── Export requirements.txt so Azure Oryx installs packages on the server ──
      - name: Export requirements.txt
        run: pip freeze > requirements.txt

      # ── Package the backend for Azure App Service zip deploy ─────────────
      - name: Zip backend for deployment
        run: |
          zip -r ../backend-deploy.zip . \
            --exclude "*.pyc" \
            --exclude "*/__pycache__/*" \
            --exclude "*/.pytest_cache/*" \
            --exclude "*/tests/*" \
            --exclude ".git/*"

      # ── Deploy to Azure App Service ───────────────────────────────────────
      # Secret required: AZURE_WEBAPP_PUBLISH_PROFILE
      #   Azure Portal → App Services → recon-desk → Overview → Download publish profile
      #   Add the entire XML contents as a GitHub secret named AZURE_WEBAPP_PUBLISH_PROFILE
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: recon-desk
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend-deploy.zip

