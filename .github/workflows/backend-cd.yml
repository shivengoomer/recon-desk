name: Backend CI/CD (Azure VM SSH)

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon_ci_only
          POSTGRES_DB: recon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://recon:recon_ci_only@localhost:5432/recon
      JWT_SECRET: ci-only-secret-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    name: Deploy to Azure VM via SSH
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script: |
            set -e

            APP_DIR="${HOME}/recon-desk"

            echo "==> Setting up repository on VM..."
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "Pulling latest code from main..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "==> Writing production environment variables..."
            cat << 'EOF' > "$APP_DIR/.env"
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }}
            DEMO_EXECUTIVE_PASSWORD=${{ secrets.DEMO_EXECUTIVE_PASSWORD }}
            DEMO_COFOUNDER_PASSWORD=${{ secrets.DEMO_COFOUNDER_PASSWORD }}
            REGISTRATION_INVITE_CODE=${{ secrets.REGISTRATION_INVITE_CODE }}
            EOF

            echo "==> Detecting Docker Compose command..."
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Error: Docker / Docker Compose is not installed on the VM."
              exit 1
            fi

            echo "==> Building and starting backend container..."
            $COMPOSE_CMD -f docker-compose.prod.yml down || true
            $COMPOSE_CMD -f docker-compose.prod.yml build
            $COMPOSE_CMD -f docker-compose.prod.yml up -d

            echo "==> Checking running container..."
            sleep 4
            docker ps --filter name=recon-desk-backend
            curl -fsS --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health
            echo "==> Backend deployed successfully!"
